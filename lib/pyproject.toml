[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "epifolio"
version = "0.1.0"
description = "Shared utilities for TCGA cancer regulatory genomics notebooks"
requires-python = ">=3.11"
dependencies = [
    "bioframe>=0.8.0",
    "numpy>=2.3,<3",
    "pandas>=3.0.0",
    "polars>=1.42.0",
    "pyarrow>=18.0.0",
    "plotly>=6.1.2",
]

[project.optional-dependencies]
# epifolio.tcpa reads AnnData/Zarr stores over HTTP. AnnData 0.13 needs
# Python 3.12, so the markers keep the base package installable on 3.11.
tcpa = [
    "anndata>=0.13.4,<0.14; python_version >= '3.12'",
    "zarr>=3.1.5,<4; python_version >= '3.12'",
    "scipy>=1.17.1,<1.18; python_version >= '3.12'",
    "fsspec>=2026.9.0; python_version >= '3.12'",
    "aiohttp>=3.14; python_version >= '3.12'",
]

[tool.hatch.build.targets.wheel]
packages = ["src/epifolio"]
