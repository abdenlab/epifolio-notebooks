[project]
name = "epifolio-notebooks"
version = "0.1.0"
description = "Marimo notebooks exploring TCGA cancer regulatory genomics data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "epifolio[tcpa]",
    "anywidget>=0.9.18",
    "bioframe>=0.8.0",
    "higlass-python>=1.4.0",
    "jupyter-scatter[all]>=1.0.1",
    "marimo>=0.21.1",
    "numpy>=2.3,<3",
    "pandas>=3.0.0",
    "pyarrow>=18.0.0",
    "plotly>=6.1.2",
    "seaborn>=0.13.2",
    "grandscatter>=0.2.1",
    "polars>=1.42.0",
    "wigglystuff>=0.5.9",
]

[tool.uv.sources]
epifolio = { path = "lib/", editable = true }

[dependency-groups]
dev = [
    "ruff>=0.15.8",
]

[tool.marimo.runtime]
output_max_bytes = 50_000_000
